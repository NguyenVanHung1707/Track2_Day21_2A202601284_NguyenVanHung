name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'src/**'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
      accuracy: ${{ steps.read_report.outputs.accuracy }}
      best_threshold: ${{ steps.read_report.outputs.best_threshold }}
      best_f1_tuned: ${{ steps.read_report.outputs.best_f1_tuned }}
      positive_ratio: ${{ steps.read_report.outputs.positive_ratio }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        run: |
          echo '${{ secrets.STORAGE_CREDENTIALS }}' > /tmp/sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV
          echo "GOOGLE_CLOUD_PROJECT=track2-day16-2a202601284" >> $GITHUB_ENV

      - name: Pull data with DVC
        run: |
          dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model & Run Bonus checks (including DagsHub MLflow)
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_USER_TOKEN }}
        run: python src/train.py

      - name: Read report & Extract metrics
        id: read_report
        run: |
          python - <<'PYEOF'
          import json, os
          with open('outputs/report.json') as f:
              d = json.load(f)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"f1={d['f1_score']}\n")
              out.write(f"accuracy={d['accuracy']}\n")
              out.write(f"best_threshold={d.get('best_threshold', 0.5)}\n")
              out.write(f"best_f1_tuned={d.get('best_f1_tuned', d['f1_score'])}\n")
              out.write(f"positive_ratio={d.get('positive_ratio', 0.248)}\n")
          PYEOF

      - name: Upload model & report to Cloud Storage (with Rollback backup)
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import os
          from google.cloud import storage

          bucket_name = os.environ["ARTIFACT_BUCKET"]
          project_id = os.environ.get("GOOGLE_CLOUD_PROJECT", "track2-day16-2a202601284")
          client = storage.Client(project=project_id)
          bucket = client.bucket(bucket_name)

          # Backup ban cu sang previous/ de ho tro rollback neu can (Bonus 4)
          cur_blob = bucket.blob("artifacts/current/model.joblib")
          if cur_blob.exists():
              prev_blob = bucket.blob("artifacts/previous/model.joblib")
              bucket.copy_blob(cur_blob, bucket, "artifacts/previous/model.joblib")
              print("Da sao luu phien ban hien tai sang artifacts/previous/model.joblib")

          cur_rep_blob = bucket.blob("artifacts/current/report.json")
          if cur_rep_blob.exists():
              bucket.copy_blob(cur_rep_blob, bucket, "artifacts/previous/report.json")
              print("Da sao luu bao cao hien tai sang artifacts/previous/report.json")

          # Upload ban moi len artifacts/current/
          blob_model = bucket.blob("artifacts/current/model.joblib")
          blob_model.upload_from_filename("models/model.joblib")
          print(f"Uploaded models/model.joblib to gs://{bucket_name}/artifacts/current/model.joblib")

          blob_report = bucket.blob("artifacts/current/report.json")
          blob_report.upload_from_filename("outputs/report.json")
          print(f"Uploaded outputs/report.json to gs://{bucket_name}/artifacts/current/report.json")
          PYEOF

      - name: Save report and detail artifacts (Bonus 3)
        uses: actions/upload-artifact@v4
        with:
          name: model-reports
          path: |
            outputs/report.json
            outputs/detail.txt


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65) va an toan hoi quy (Bonus 4).
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install google-cloud-storage

      - name: Check quality gate & regression safety (Bonus 4)
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
          F1_NEW: ${{ needs.train.outputs.f1 }}
        run: |
          python - <<'PYEOF'
          import os, json
          from google.cloud import storage

          f1_new = float(os.environ["F1_NEW"])
          print("=" * 60)
          print(f"[QUALITY GATE] Kiem tra F1-score: {f1_new:.4f}")
          print("=" * 60)

          # 1. Kiem tra nguong co ban >= 0.65
          if f1_new < 0.65:
              raise SystemExit(f"FAILED: f1_score {f1_new:.4f} < 0.65. Huy trien khai!")
          print(f"✓ PASSED BASE GATE: f1_score {f1_new:.4f} >= 0.65")

          # 2. Bonus 4: Kiem tra an toan so voi model phien ban truoc do (neu co)
          try:
              cred_json = os.environ.get("STORAGE_CREDENTIALS")
              if cred_json:
                  with open("/tmp/sa-key.json", "w") as f:
                      f.write(cred_json)
                  os.environ["GOOGLE_APPLICATION_CREDENTIALS"] = "/tmp/sa-key.json"

              bucket_name = os.environ.get("ARTIFACT_BUCKET")
              if bucket_name:
                  client = storage.Client(project="track2-day16-2a202601284")
                  bucket = client.bucket(bucket_name)
                  prev_blob = bucket.blob("artifacts/previous/report.json")
                  if prev_blob.exists():
                      prev_data = json.loads(prev_blob.download_as_text())
                      prev_f1 = float(prev_data.get("f1_score", 0.0))
                      print(f"[BONUS 4 - SAFETY CHECK] F1 moi: {f1_new:.4f} vs F1 cu: {prev_f1:.4f}")
                      if f1_new < prev_f1 - 0.05:
                          raise SystemExit(f"FAILED: F1 moi ({f1_new:.4f}) giam manh so voi F1 cu ({prev_f1:.4f}). Tu dong Rollback!")
                      else:
                          print(f"✓ PASSED REGRESSION CHECK: Model moi khong bi suy giam chat luong nghiem trong.")
                  else:
                      print("[BONUS 4 - SAFETY CHECK] Day la phien ban dau tien tren cloud storage, khong co model cu.")
          except Exception as e:
              print(f"[NOTE] Safety check note: {e}")

          print("✓ DU DIEU KIEN TRIEN KHAI LEN PRODUCTION.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Trien khai len VM qua SSH va kiem tra live API.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            sleep 5
            curl -sf http://localhost:8080/healthz && echo "Health check passed." || exit 1
